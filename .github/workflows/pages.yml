name: Build and publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_cache:
        description: Ignore all saved website assets and retrieve them again
        type: boolean
        default: false
      refresh_extension:
        description: Refetch assets for one extension (optional, e.g. semver)
        type: string
        default: ''
  schedule:
    - cron: '30 10 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/install-tools.py
      - run: echo "$PWD/.tools" >> "$GITHUB_PATH"
      - name: Find saved website assets
        id: assets
        if: ${{ !inputs.rebuild_cache }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          ASSET_NAME: website-assets-v1-${{ hashFiles('scripts/image_notices.py') }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
            const branch = context.ref.replace('refs/heads/', '');
            for await (const {data: runs} of github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'pages.yml', branch, status: 'completed', per_page: 100
            })) {
              for (const run of runs) {
                if (Date.parse(run.created_at) < cutoff) return;
                const {data} = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: run.id});
                if (data.artifacts.some(a => a.name === process.env.ASSET_NAME && !a.expired)) {
                  core.setOutput('run_id', run.id);
                  return;
                }
              }
            }
            core.info('No saved assets; the generator will retrieve them.');
      - name: Restore saved website assets
        if: ${{ steps.assets.outputs.run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: website-assets-v1-${{ hashFiles('scripts/image_notices.py') }}
          path: .cache
          github-token: ${{ github.token }}
          run-id: ${{ steps.assets.outputs.run_id }}
      - name: Test metadata processing
        run: python -m unittest discover -s tests -v
      - name: Generate website data and retrieve missing assets
        id: generate
        env:
          REBUILD_CACHE: ${{ inputs.rebuild_cache }}
          REFRESH_EXTENSION: ${{ inputs.refresh_extension }}
        run: |
          args=(--refresh --scan --workers 4)
          if [[ "$REBUILD_CACHE" == "true" ]]; then args+=(--rebuild-cache); fi
          if [[ -n "$REFRESH_EXTENSION" ]]; then args+=(--refresh-extension "$REFRESH_EXTENSION"); fi
          python scripts/generate.py "${args[@]}"
      - name: Save website assets for the next build
        if: ${{ always() && (steps.generate.outcome == 'success' || steps.generate.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: website-assets-v1-${{ hashFiles('scripts/image_notices.py') }}
          path: |
            .cache/oci
            .cache/image-notices-v1
            .cache/version-history
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Build Hugo
        run: hugo --minify --baseURL 'https://cnpg-extensions.github.io/'
      - name: Validate generated output
        run: python scripts/check-site.py public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    if: github.repository == 'cnpg-extensions/cnpg-extensions.github.io' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
