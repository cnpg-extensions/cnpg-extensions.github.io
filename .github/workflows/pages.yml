name: Build and publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_cache:
        description: Ignore all saved website assets and retrieve them again
        type: boolean
        default: false
      refresh_extension:
        description: Refetch assets for one extension (optional, e.g. semver)
        type: string
        default: ''
  schedule:
    - cron: '30 10 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  inspect:
    name: Scan image shard ${{ matrix.shard }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/prepare-website
        with:
          rebuild-cache: ${{ inputs.rebuild_cache }}
      - name: Inspect and scan current images
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_CACHE: ${{ inputs.rebuild_cache }}
          REFRESH_EXTENSION: ${{ inputs.refresh_extension }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          args=(--refresh --scan --workers 4 --evidence-only --shard-index "$SHARD_INDEX" --shard-count 4)
          if [[ "$REBUILD_CACHE" == "true" ]]; then args+=(--rebuild-cache); fi
          if [[ -n "$REFRESH_EXTENSION" ]]; then args+=(--refresh-extension "$REFRESH_EXTENSION"); fi
          python scripts/generate.py "${args[@]}"
      - name: Save fresh evidence and retrieved assets
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: website-evidence-${{ matrix.shard }}
          overwrite: true
          path: |
            .cache/inspected-shard-*.json
            .cache/oci
            .cache/image-notices-v1
            static/reports
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 1
  history:
    name: Refresh version history
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/prepare-website
        with:
          rebuild-cache: ${{ inputs.rebuild_cache }}
      - name: Retrieve current version history
        env:
          REFRESH_EXTENSION: ${{ inputs.refresh_extension }}
        run: |
          args=()
          if [[ -n "$REFRESH_EXTENSION" ]]; then args+=(--refresh-extension "$REFRESH_EXTENSION"); fi
          python scripts/history_evidence.py "${args[@]}"
      - name: Save history and retrieved assets
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: website-evidence-history
          overwrite: true
          path: |
            .cache/version-history
            .cache/history-commits.json
            data/version_history.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 1
  build:
    needs: [inspect, history]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/prepare-website
        with:
          rebuild-cache: ${{ inputs.rebuild_cache }}
      - name: Collect fresh evidence and retrieved assets
        uses: actions/download-artifact@v8
        with:
          pattern: website-evidence-*
          merge-multiple: true
      - name: Require successful scans and history
        env:
          INSPECT_RESULT: ${{ needs.inspect.result }}
          HISTORY_RESULT: ${{ needs.history.result }}
        run: |
          test "$INSPECT_RESULT" = success
          test "$HISTORY_RESULT" = success
      - name: Test metadata processing
        run: python -m unittest discover -s tests -v
      - name: Assemble fresh evidence and website data
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_EXTENSION: ${{ inputs.refresh_extension }}
        run: |
          args=(--refresh --merge-evidence --merge-history)
          if [[ -n "$REFRESH_EXTENSION" ]]; then args+=(--refresh-extension "$REFRESH_EXTENSION"); fi
          python scripts/generate.py "${args[@]}"
      - name: Save website assets for the next build
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: website-assets-v1-${{ hashFiles('scripts/image_notices.py') }}
          overwrite: true
          path: |
            .cache/oci
            .cache/image-notices-v1
            .cache/version-history
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Build Hugo
        run: hugo --minify --baseURL 'https://cnpg-extensions.github.io/'
      - name: Validate generated output
        run: python scripts/check-site.py public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
  deploy:
    if: github.repository == 'cnpg-extensions/cnpg-extensions.github.io' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
