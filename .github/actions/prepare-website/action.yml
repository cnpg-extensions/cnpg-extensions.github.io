name: Prepare website build
description: Install pinned tools and restore compatible immutable website assets.
inputs:
  rebuild-cache:
    description: Skip restoration of saved website assets
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.15'
        cache: pip
    - shell: bash
      run: pip install -r requirements.txt
    - shell: bash
      run: python scripts/install-tools.py
    - shell: bash
      run: echo "$PWD/.tools" >> "$GITHUB_PATH"
    - name: Find saved website assets
      id: assets
      if: ${{ inputs.rebuild-cache != 'true' }}
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        ASSET_NAME: website-assets-v1-${{ hashFiles('scripts/image_notices.py') }}
      with:
        script: |
          const {owner, repo} = context.repo;
          const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
          const branch = context.ref.replace('refs/heads/', '');
          // A new working branch can reuse immutable assets from the default branch.
          for (const sourceBranch of new Set([branch, context.payload.repository.default_branch])) {
            for await (const {data: runs} of github.paginate.iterator(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'pages.yml', branch: sourceBranch, status: 'completed', per_page: 100
            })) {
              let expired = false;
              for (const run of runs) {
                if (Date.parse(run.created_at) < cutoff) { expired = true; break; }
                const {data} = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: run.id});
                if (data.artifacts.some(a => a.name === process.env.ASSET_NAME && !a.expired)) {
                  core.setOutput('run_id', run.id);
                  return;
                }
              }
              if (expired) break;
            }
          }
          core.info('No saved assets; the generator will retrieve them.');
    - name: Restore saved website assets
      if: ${{ steps.assets.outputs.run_id != '' }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: website-assets-v1-${{ hashFiles('scripts/image_notices.py') }}
        path: .cache
        github-token: ${{ github.token }}
        run-id: ${{ steps.assets.outputs.run_id }}
